<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Launcher Logs</title>
  <link rel="icon" href="icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'JetBrains Mono', 'Courier New', monospace;
      background: #0c0c10;
      color: #c8c8d0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Custom Title Bar */
    .title-bar {
      height: 32px;
      background: rgba(10, 10, 15, 0.95);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      display: flex;
      justify-content: space-between;
      align-items: center;
      -webkit-app-region: drag;
      padding: 0 12px;
      flex-shrink: 0;
    }
    .title-bar-text {
      font-family: 'Outfit', sans-serif;
      font-size: 12px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.6);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .title-bar-controls {
      display: flex;
      -webkit-app-region: no-drag;
    }
    .title-bar-controls button {
      background: transparent;
      border: none;
      width: 36px;
      height: 32px;
      color: rgba(255, 255, 255, 0.5);
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }
    .title-bar-controls button:hover { background: rgba(255, 255, 255, 0.08); color: #fff; }
    .title-bar-controls .close-btn:hover { background: #ff1744 !important; color: #fff !important; }

    /* Toolbar */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      background: rgba(15, 15, 20, 0.8);
      flex-shrink: 0;
    }
    .toolbar button {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: rgba(255, 255, 255, 0.7);
      border-radius: 6px;
      padding: 6px 14px;
      font-size: 11px;
      font-family: 'Outfit', sans-serif;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .toolbar button:hover { background: rgba(255, 255, 255, 0.1); color: #fff; }
    .log-count {
      margin-left: auto;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.3);
      font-family: 'Outfit', sans-serif;
    }
    .filter-badge {
      background: rgba(0, 176, 255, 0.1);
      border: 1px solid rgba(0, 176, 255, 0.2);
      color: #00b0ff;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 10px;
      font-family: 'Outfit', sans-serif;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .filter-badge.active { background: rgba(0, 176, 255, 0.25); }
    .filter-badge.info-badge { border-color: rgba(0, 176, 255, 0.3); color: #00b0ff; background: rgba(0, 176, 255, 0.1); }
    .filter-badge.info-badge.active { background: rgba(0, 176, 255, 0.25); }
    .filter-badge.error-badge { border-color: rgba(255, 23, 68, 0.3); color: #ff1744; background: rgba(255, 23, 68, 0.1); }
    .filter-badge.error-badge.active { background: rgba(255, 23, 68, 0.25); }
    .filter-badge.warn-badge { border-color: rgba(255, 183, 77, 0.3); color: #ffb74d; background: rgba(255, 183, 77, 0.1); }
    .filter-badge.warn-badge.active { background: rgba(255, 183, 77, 0.25); }

    /* Log Area */
    .log-area {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      font-size: 12px;
      line-height: 1.6;
    }
    .log-line {
      padding: 2px 8px;
      border-radius: 4px;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .log-line:hover { background: rgba(255, 255, 255, 0.03); }
    .log-line .timestamp {
      color: rgba(255, 255, 255, 0.25);
      margin-right: 8px;
      font-size: 10px;
    }
    .log-line.info { color: #c8c8d0; }
    .log-line.system { color: #00b0ff; }
    .log-line.warn { color: #ffb74d; }
    .log-line.error { color: #ff1744; font-weight: 700; }
    .log-line.debug { color: rgba(255, 255, 255, 0.4); }

    /* Scrollbar */
    .log-area::-webkit-scrollbar { width: 6px; }
    .log-area::-webkit-scrollbar-track { background: transparent; }
    .log-area::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.06); border-radius: 10px; }
    .log-area::-webkit-scrollbar-thumb:hover { background: rgba(0, 176, 255, 0.3); }
  </style>
</head>
<body>
  <div class="title-bar">
    <span class="title-bar-text">
      <img src="icon.png" style="width: 14px; height: 14px; border-radius: 3px;" alt="logo">
      <span>Launcher Debug Console</span>
    </span>
    <div class="title-bar-controls">
      <button id="win-minimize" title="Minimize">—</button>
      <button class="close-btn" id="win-close" title="Close">&times;</button>
    </div>
  </div>

  <div class="toolbar">
    <button id="clear-btn">Clear</button>
    <div class="filter-badge active" data-filter="all">ALL</div>
    <div class="filter-badge info-badge" data-filter="info">INFO</div>
    <div class="filter-badge warn-badge" data-filter="warn">WARN</div>
    <div class="filter-badge error-badge" data-filter="error">ERROR</div>
    <span class="log-count" id="log-count">0 entries</span>
  </div>

  <div class="log-area" id="log-area">
    <div class="log-line system"><span class="timestamp">[--:--:--]</span>[System] Debug console ready. Waiting for logs...</div>
  </div>

  <script>
    const logArea = document.getElementById('log-area');
    const logCount = document.getElementById('log-count');
    let totalLogs = 0;
    let activeFilter = 'all';

    // Receive logs from main process
    window.consoleApi.onLog((data) => {
      appendLog(data.message, data.level || 'info');
    });

    function appendLog(message, level) {
      const el = document.createElement('div');
      el.className = `log-line ${level}`;
      const now = new Date();
      const ts = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
      el.innerHTML = `<span class="timestamp">[${ts}]</span>${escapeHtml(message)}`;
      el.dataset.level = level;
      logArea.appendChild(el);
      totalLogs++;
      logCount.textContent = `${totalLogs} entries`;

      // Apply filter
      if (activeFilter !== 'all' && level !== activeFilter) {
        el.style.display = 'none';
      }

      // Auto-scroll
      logArea.scrollTop = logArea.scrollHeight;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Clear button
    document.getElementById('clear-btn').addEventListener('click', () => {
      logArea.innerHTML = '';
      totalLogs = 0;
      logCount.textContent = '0 entries';
    });

    // Filter badges
    document.querySelectorAll('.filter-badge').forEach(badge => {
      badge.addEventListener('click', () => {
        document.querySelectorAll('.filter-badge').forEach(b => b.classList.remove('active'));
        badge.classList.add('active');
        activeFilter = badge.dataset.filter;

        document.querySelectorAll('.log-line').forEach(line => {
          if (activeFilter === 'all' || line.dataset.level === activeFilter) {
            line.style.display = '';
          } else {
            line.style.display = 'none';
          }
        });
      });
    });

    // Window controls
    document.getElementById('win-minimize').addEventListener('click', () => window.consoleApi.minimizeWindow());
    document.getElementById('win-close').addEventListener('click', () => window.consoleApi.closeWindow());
  </script>
</body>
</html>
